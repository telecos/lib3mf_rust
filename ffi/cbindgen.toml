language = "C"
include_guard = "LIB3MF_FFI_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"
tab_width = 4
style = "both"
cpp_compat = true
include_version = true
no_includes = false

[defines]

[export]
include = [
    "Lib3mfResult",
    "Lib3mfVertex",
    "Lib3mfTriangle",
]

[export.rename]

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"

[parse]
parse_deps = false

[parse.expand]
