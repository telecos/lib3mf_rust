[package]
name = "lib3mf-slicer"
version = "0.1.0"
edition = "2024"
authors = ["lib3mf_rust contributors"]
description = "3MF file slicer tool that generates slice images from 3D models"
license = "MIT"
repository = "https://github.com/telecos/lib3mf_rust"
homepage = "https://github.com/telecos/lib3mf_rust/tree/main/tools/slicer"
readme = "README.md"
keywords = ["3mf", "3d", "slicer", "3dprinting"]
categories = ["command-line-utilities"]
exclude = ["samples/"]

[[bin]]
name = "lib3mf-slicer"
path = "src/main.rs"

[dependencies]
lib3mf = { path = "../../", features = ["mesh-ops", "polygon-ops"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
thiserror = "2.0"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
crypto = ["lib3mf/crypto"]

[lints.rust]
unsafe_code = "forbid"
